name: Update GitHub stats cards

# Renders the profile stats cards to SVG files inside this repository and commits
# them. The README points at those local files, so the profile never depends on a
# third-party service being reachable when someone loads the page.
#
# Token: set a repository secret named STATS_PAT (a classic PAT with `repo` scope)
# to include private-repository commits and pull requests in the numbers. Until
# that secret exists the `token` input is empty, the action falls back to the
# built-in GITHUB_TOKEN, and the cards simply show public figures instead.

on:
  schedule:
    # 18:00 UTC = 04:00 the next morning in Sydney (AEST, UTC+10).
    - cron: '0 18 * * *'
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# The job pushes the regenerated SVGs back to the default branch.
permissions:
  contents: write

# Never let two runs race each other into a push conflict.
concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        # Third-party actions are pinned to immutable commit SHAs rather than
        # tags, because a tag can be repointed at new code that would run with
        # STATS_PAT in scope.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the overall stats card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          # Pin the renderer to an exact npm version: published npm versions are
          # immutable, so this is deterministic, unlike the default "v2" which
          # resolves to whatever the latest 2.x happens to be on the day.
          # Do not use the action's bundled 2.1.3 — it treats the FORBIDDEN that
          # GITHUB_TOKEN gets on `stargazers` as fatal and renders an error card.
          core_version: '2.1.5'
          # `include_all_commits` and the `show` rows are backed by GitHub's
          # code search index. They need STATS_PAT: with the built-in
          # GITHUB_TOKEN the same options reported 9 pull requests instead of
          # 449, because an app installation token cannot see activity outside
          # this repository. If the PAT ever expires, drop both from this line
          # rather than leaving the card to publish wrong numbers.
          #
          # `repo` and `owner` are an allow-list, and the renderer has no
          # deny-list for commits — `exclude_repo` only affects the star count.
          # So every source of commits is listed here EXCEPT two copies of
          # LaurenceHo/simple-photo-albums, whose commits share the same SHAs
          # and would otherwise each be counted a second time:
          #
          #   LaurenceHo/simple-photo-albums-demo    176  the public mirror
          #   pradiptabasu/quasar-s3-photo-albums     55  a fork GitHub detached
          #                                               when this repo went
          #                                               private
          #
          # 1235 commits in total, 1004 once both copies are left out.
          #
          # `author:LaurenceHo` is always part of the query, so naming an owner
          # never pulls in anybody else's commits — it only widens which
          # repositories are searched.
          #
          # MAINTENANCE: add new repositories of your own to `repo` below, or
          # their commits will stop being counted.
          options: |
            {
              "username": "LaurenceHo",
              "show_icons": "true",
              "theme": "dracula",
              "hide": "stars,contribs,issues",
              "show": "prs_merged,prs_commented,prs_reviewed",
              "hide_rank": "true",
              "card_width": "445",
              "include_all_commits": "true",
              "repo": [
                "LaurenceHo/adventjs",
                "LaurenceHo/angular4-express-mysql",
                "LaurenceHo/electron-quasar-trip-management",
                "LaurenceHo/health-onboarding-form",
                "LaurenceHo/LaurenceHo",
                "LaurenceHo/my-groceries",
                "LaurenceHo/react-trip-planner",
                "LaurenceHo/react-weather-app",
                "LaurenceHo/simple-photo-albums",
                "LaurenceHo/vue2-element-trip-planner"
              ],
              "owner": [
                "BenchmarkGlobalPtyLtd",
                "talentappstore"
              ]
            }

      - name: Generate the top languages card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          core_version: '2.1.5'
          # No `role` parameter, so this stays at the OWNER default and reports
          # only your own repositories. Adding ORGANIZATION_MEMBER would pull in
          # employer repositories and publish their language mix.
          #
          # OWNER does include the demo mirror, whose languages duplicate
          # simple-photo-albums, so exclude it. Here `exclude_repo` takes bare
          # repository names, unlike the stats card's owner/name form.
          options: username=LaurenceHo&layout=compact&theme=dracula&card_width=445&exclude_repo=simple-photo-albums-demo

      - name: Commit the cards, but only if they actually changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg
          # `git commit` fails when there is nothing staged, so guard it and keep
          # the run green on days where the numbers did not move.
          git diff --staged --quiet || git commit -m 'chore: refresh GitHub stats cards'
          git push
