<svg width="445" height="100" viewBox="0 0 445 100" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Overall GitHub contributions since 2014: 6,422">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ff6e96 }
    .value  { font: 700 30px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8f8f2 }
    .sub    { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8f8f2; opacity: 0.7 }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="444" height="99%"
        stroke="#e4e2e2" fill="#282a36" stroke-opacity="1" />
  <text x="25" y="34" class="header">Overall Contributions</text>
  <text x="25" y="74" class="value">6,422</text>
  <text x="420" y="74" class="sub" text-anchor="end">since 2014, public and private</text>
</svg>
